pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { 
            url 'https://github.com/jitsi/jitsi-maven-repository/raw/master/releases' 
            metadataSources {
                mavenPom()
                artifact()
            }
        }
        maven { 
            url 'https://jitpack.io' 
            metadataSources {
                mavenPom()
                artifact()
            }
        }
        // Fallback repository for missing dependencies
        jcenter()
        maven { url 'https://jitpack.io' }
        mavenCentral()
        maven { 
            url "https://maven.google.com" 
            metadataSources {
                mavenPom()
                artifact()
            }
        }
        maven { 
            url "https://jcenter.bintray.com" 
            metadataSources {
                mavenPom()
                artifact()
            }
        }
        // Required for android-scalablevideoview dependency
        maven {
            url 'https://repo.spring.io/libs-release'
        }
        // Add the Maven Central repository explicitly for the missing dependency
        maven { 
            url "https://repo1.maven.org/maven2" 
            metadataSources {
                mavenPom()
                artifact()
            }
        }
    }
}

rootProject.name = "Smart Healthcare"
include ':app'